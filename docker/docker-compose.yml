services:
  mysql:
    image: mysql:8.4
    container_name: andypratama-studio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-andypratama_studio}
      MYSQL_USER: ${MYSQL_USER:-andy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studio_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - studio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  studio_mysql_data:
